name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:banks
      - run: npm run export:banks
      - run: git diff --exit-code -- question-banks/normalized
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
